name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-26-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show environment
        run: |
          python3 --version
          xcodebuild -version
          sw_vers

      - name: Install system dependencies
        run: |
          brew install autoconf automake libtool pkg-config
          brew link libtool || true

      - name: Install kivy-ios
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "Cython<3.0"
          python3 -m pip install "kivy-ios==2025.5.17"

          cython --version
          toolchain --version || true

     

      - name: Prepare iOS app source
        run: |
          mkdir ios_app

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.idea' \
            --exclude='.buildozer' \
            --exclude='bin' \
            --exclude='src/android' \
            --exclude='buildozer.spec' \
            ./ ios_app/

          test -f ios_app/main.py

      - name: Build Kivy iOS toolchain
        run: |
          toolchain build hostpython3
          toolchain build python3 kivy

      - name: Create Xcode project
        run: |
          toolchain create MangoLWT "$GITHUB_WORKSPACE/ios_app"

          echo "Generated projects:"
          find . -name "*.xcodeproj"

      - name: Inspect Xcode project
        run: |
          PROJECT=$(find . -path '*-ios/*.xcodeproj' | head -n 1)

          echo "Project: $PROJECT"

          if [ -z "$PROJECT" ]; then
            echo "Xcode project not found"
            exit 1
          fi

          xcodebuild -list -project "$PROJECT"

      - name: Build unsigned iOS app
        run: |
          PROJECT=$(find . -path '*-ios/*.xcodeproj' | head -n 1)

          mkdir -p "$GITHUB_WORKSPACE/build-ios"

          xcodebuild \
            -project "$PROJECT" \
            -alltargets \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build-ios" \
            build

      - name: Show build products
        if: always()
        run: |
          find build-ios -maxdepth 3 -type d -name "*.app" 2>/dev/null || true
          find . -name "*.xcodeproj" 2>/dev/null || true

      - name: Upload iOS build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MangoLWT-iOS-build
          path: |
            build-ios
            *-ios
